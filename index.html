<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Test — Scene Viewer</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
   body {
    margin: 0;
    font-family: 'Quicksand', -apple-system, Roboto, sans-serif;
    background: #111;
    color: #eee;
    text-align: center;
    padding: 20px;
  }
   h2 {
    margin-bottom: 4px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    letter-spacing: 0.5px;
  }
   p.sub { color: #999; margin-top: 0; font-size: 14px; }
  model-viewer {
    width: 100%;
    height: 420px;
    background: #1a1a1a;
    border-radius: 12px;
  }
  .model-wrap {
    position: relative;
  }
  .model-loading {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    border-radius: 12px;
    color: #ccc;
    font-size: 15px;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  a.button {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 24px;
    background: #227836;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
  }
  .note {
    font-size: 13px;
    color: #888;
    margin-top: 20px;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }
  .slideshow {
    position: relative;
    max-width: 480px;
    margin: 10px auto 0;
    background: #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
  }
  .slideshow img {
    display: block;
    width: 100%;
    height: 280px;
    object-fit: cover;
    background: #000;
    transition: opacity 0.15s ease;
  }
  .slideshow .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 10px 0;
  }
  .slideshow button {
    background: #333;
    color: #eee;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 14px;
  }
  .slideshow button:hover { background: #444; }
  .slideshow button:disabled { opacity: 0.5; cursor: default; }
  .slideshow .counter { font-size: 13px; color: #999; min-width: 70px; }
  .slideshow .preload-status {
    font-size: 12px;
    color: #777;
    padding: 6px 0 0;
  }
</style>
</head>
<body>

<h2>Branching Frames</h2>

<div class="model-wrap">
  <model-viewer
    src="https://abirIITR.github.io/ar-nature/model.glb"
    ios-src="https://abirIITR.github.io/ar-nature/model.usdz"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    alt="A 3D nature model">
  </model-viewer>
  <div class="model-loading" id="model-loading">Loading model...</div>
</div>


<a class="button" href="intent://arvr.google.com/scene-viewer/1.0?file=https://abirIITR.github.io/ar-nature/model.glb&mode=ar_preferred#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=https://abirIITR.github.io/ar-nature/;end;">
  Open in AR view (Android)
</a>




<h2 style="margin-top:40px;">Photo Slideshow</h2>

<div class="slideshow">
  <img id="slide-img" src="" alt="Slideshow image">
  <div class="controls">
    <button id="prev-btn" disabled>‹ Prev</button>
    <span class="counter" id="slide-counter">Loading…</span>
    <button id="next-btn" disabled>Next ›</button>
    <button id="play-btn" disabled>▶ Auto</button>
  </div>
  <div class="preload-status" id="preload-status"></div>
</div>

<script>
  // Hide the "Loading model..." overlay once the .glb has finished loading.
  const modelViewerEl = document.querySelector('model-viewer');
  const modelLoadingEl = document.getElementById('model-loading');
  if (modelViewerEl && modelLoadingEl) {
    modelViewerEl.addEventListener('load', () => {
      modelLoadingEl.style.opacity = '0';
      setTimeout(() => { modelLoadingEl.style.display = 'none'; }, 200);
    });
    modelViewerEl.addEventListener('error', () => {
      modelLoadingEl.textContent = 'Failed to load model';
    });
  }
</script>

<script>
  // ---- Slideshow config: adjust these to match your repo ----
  const IMAGE_BASE = 'https://abirIITR.github.io/ar-nature/';
  const IMAGE_COUNT = 48;          // how many "b (N)" images you have
  const IMAGE_EXT = 'JPG';         // file extension used in the repo
  const AUTO_INTERVAL_MS = 3000;   // time between slides when auto-playing
  // -------------------------------------------------------------

  const imageSrcs = Array.from({ length: IMAGE_COUNT }, (_, i) =>
    `${IMAGE_BASE}b (${String(i + 1).padStart(2, '0')}).${IMAGE_EXT}`
  );

  let current = 0;
  let autoTimer = null;
  let loadedCount = 0;
  const preloadedImages = new Array(imageSrcs.length);

  const imgEl = document.getElementById('slide-img');
  const counterEl = document.getElementById('slide-counter');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const playBtn = document.getElementById('play-btn');
  const statusEl = document.getElementById('preload-status');

  function showSlide(index) {
    current = (index + imageSrcs.length) % imageSrcs.length;
    imgEl.src = imageSrcs[current];
    counterEl.textContent = `${current + 1} / ${imageSrcs.length}`;
  }

  function stopAuto() {
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
      playBtn.textContent = '▶ Auto';
    }
  }

  prevBtn.addEventListener('click', () => { stopAuto(); showSlide(current - 1); });
  nextBtn.addEventListener('click', () => { stopAuto(); showSlide(current + 1); });

  playBtn.addEventListener('click', () => {
    if (autoTimer) {
      stopAuto();
    } else {
      playBtn.textContent = '⏸ Stop';
      autoTimer = setInterval(() => showSlide(current + 1), AUTO_INTERVAL_MS);
    }
  });

  // Preload all images into the browser cache before enabling the controls.
  // The first image is shown as soon as IT loads, so the user isn't stuck
  // staring at a blank box while the rest load in the background.
  imageSrcs.forEach((src, i) => {
    const img = new Image();
    img.onload = img.onerror = () => {
      loadedCount++;
      statusEl.textContent = `Preloading images… ${loadedCount}/${imageSrcs.length}`;

      if (i === 0) {
        showSlide(0);
      }

      if (loadedCount === imageSrcs.length) {
        statusEl.textContent = '';
        prevBtn.disabled = false;
        nextBtn.disabled = false;
        playBtn.disabled = false;
      }
    };
    img.src = src;
    preloadedImages[i] = img;
  });
</script>

</body>
</html>
