<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Test — Scene Viewer</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  body {
    margin: 0;
    font-family: -apple-system, Roboto, sans-serif;
    background: #111;
    color: #eee;
    text-align: center;
    padding: 20px;
  }
  h2 { margin-bottom: 4px; }
  p.sub { color: #999; margin-top: 0; font-size: 14px; }
  model-viewer {
    width: 100%;
    height: 420px;
    background: #1a1a1a;
    border-radius: 12px;
  }
  a.button {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 24px;
    background: #4285F4;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
  }
  .note {
    font-size: 13px;
    color: #888;
    margin-top: 20px;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }
</style>
</head>
<body>

<h2>AR Object Test</h2>

<model-viewer
  src="https://abirIITR.github.io/ar-nature/model.glb"
  ios-src="https://abirIITR.github.io/ar-nature/model.usdz"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  alt="A 3D nature model">
</model-viewer>


<a class="button" href="intent://arvr.google.com/scene-viewer/1.0?file=https://abirIITR.github.io/ar-nature/model.glb&mode=ar_preferred#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=https://abirIITR.github.io/ar-nature/;end;">
  Open in Scene Viewer (Android)
</a>




</body>
</html>
